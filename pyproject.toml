[tool.poetry]
name = "secreqgen"
version = "0.1.0"
description = "RAG-enhanced security requirements generator for Master's thesis"
authors = ["George G"]
readme = "README.md"
packages = [{include = "secreqgen", from = "src"}]

[tool.poetry.dependencies]
python = "^3.11,<3.14"
typer = {extras = ["all"], version = "^0.15.0"}
langchain = "^0.2.0"
langchain-community = "^0.2.0"
chromadb = "^0.4.0"
sentence-transformers = "^2.2.0"
pydantic = "^2.0.0"
pydantic-settings = "^2.0.0"
python-dotenv = "^1.0.0"
rich = "^13.0.0"
pyyaml = "^6.0"
pypdf = "^4.0.0"
python-docx = "^1.0.0"
tiktoken = "^0.8.0"
httpx = "^0.27.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0.0"
pytest-cov = "^4.0.0"
black = "^24.0.0"
ruff = "^0.3.0"
mypy = "^1.8.0"

[tool.poetry.scripts]
secreqgen = "secreqgen.cli:app"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 88
target-version = ['py311']

[tool.ruff]
line-length = 88
target-version = "py311"
select = ["E", "F", "I", "N", "W", "UP"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = true
